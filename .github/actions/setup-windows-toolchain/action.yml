name: 'Setup Windows Toolchain'
description: 'Configure msbuild, MPI, ccache, ninja, and MSVC'
runs:
  using: 'composite'
  steps:
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: 'latest'
    - name: Setup MPI
      uses: mpi4py/setup-mpi@v1
      with:
        mpi: msmpi
    - name: Setup ccache
      uses: Chocobo1/setup-ccache-action@v1
      with:
        windows_compile_environment: msvc
    - name: Setup ninja manually
      shell: pwsh
      run: |
        # Проверяем, установлен ли уже ninja
        if (!(Get-Command ninja -ErrorAction SilentlyContinue)) {
          Write-Host "Installing Ninja via Chocolatey..."
          choco install ninja -y --no-progress
          Write-Host "Ninja installed successfully via Chocolatey"
        } else {
          Write-Host "Ninja already installed"
        }
    - name: Setup MSVC for Ninja again
      uses: ilammy/msvc-dev-cmd@v1
